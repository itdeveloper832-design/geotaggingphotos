<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true" class="map-icon-svg">
  <defs>
    <!-- Premium Gradient Matching Website & Screenshot Aesthetic -->
    <linearGradient id="mapIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A52F4"/>
      <stop offset="50%" stop-color="#6739EE"/>
      <stop offset="100%" stop-color="#4E2BE6"/>
    </linearGradient>
    
    <!-- Ambient Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#4E2BE6" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Main Squircle Container -->
  <rect x="12" y="16" width="76" height="76" rx="26" ry="26" fill="url(#mapIconGrad)" filter="url(#iconShadow)"/>

  <!-- Map Pin Symbol (Bold White Line-Art) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Teardrop Pin Outline -->
    <path d="M50 35C42.5 35 36.5 41 36.5 48.5C36.5 58 50 72.5 50 72.5C50 72.5 63.5 58 63.5 48.5C63.5 41 57.5 35 50 35Z" stroke-width="5"/>
    <!-- Center Dot Circle -->
    <circle cx="50" cy="47.5" r="4" stroke-width="4.5"/>
  </g>

  <!-- Top-Right Vibrant Mint Green Badge Dot with Thick White Border -->
  <circle cx="82" cy="18" r="11.5" fill="#00D285" stroke="#FFFFFF" stroke-width="4"/>
</svg>
